name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build and load Docker image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ps2-usbhdl-build:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build installer ELF
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -u "$(id -u):$(id -g)" \
            ps2-usbhdl-build:latest \
            make

      - name: Build test ISO
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -u "$(id -u):$(id -g)" \
            ps2-usbhdl-build:latest \
            sh /src/test/build-iso.sh

      - name: List artifacts
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps2-usbhdl-${{ github.sha }}
          path: |
            dist/ps2-usbhdl.elf
            dist/test.iso
          retention-days: 14
